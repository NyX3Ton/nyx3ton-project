services:
  few-shot-validator:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: few-shot-validator:qwen35-gpu
    container_name: few-shot-validator
    ports:
      - "127.0.0.1:7860:7860"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./hf_cache:/app/.cache/huggingface
      - ./mlflow_runs:/app/mlflow_runs
      - ./outputs:/app/outputs
    environment:
      # Main model. Change this to the exact public / private HF model id you want.
      # If the repo is gated/private, set HF_TOKEN below or in .env.
      LLM_MODEL_ID: "unsloth/Qwen3.5-9B"
      FALLBACK_LLM_MODEL_ID: "unsloth/Qwen3.5-4B"
      AUX_LLM_MODEL_ID: "Qwen/Qwen3-4B-Thinking-2507"
      LLM_LOAD_MODE: "auto"
      MAX_GPU_MEMORY: "10.5GiB"
      MAX_INPUT_TOKENS: "8192"
      MAX_NEW_TOKENS: "900"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      GRADIO_INBROWSER: "0"
      START_MLFLOW_UI: "1"
      OPEN_MLFLOW_UI_BROWSER: "0"
      MLFLOW_UI_HOST: "0.0.0.0"
      MLFLOW_UI_PORT: "5001"
      MLFLOW_EXPERIMENT_NAME: "few-shot-cv-validator-docker"
      HF_HOME_LOCAL: "/app/.cache/huggingface"
      # HF_TOKEN: "hf_xxx"
    gpus: all
    restart: unless-stopped
