services:
  ai-prompt-sim-rag-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: ai-prompt-sim-rag:cpu
    container_name: ai-prompt-sim-rag-cpu

    ports:
      - "127.0.0.1:7860:7860"
      - "127.0.0.1:5002:5001"

    volumes:
      - ./hf_cache:/app/hf_cache
      - ./ov_models:/app/ov_models
      - ./ov_cache:/app/ov_cache
      - ./mlflow_runs:/app/mlflow_runs
      - ./rag_uploads:/app/rag_uploads
      - ./markdown_outputs:/app/markdown_outputs
      - ./outputs:/app/outputs

    environment:
      APP_SCRIPT: "ai-prompt-sim.py"

      # CPU smoke-test option:
      # LOCAL_MODEL_NAME: "Qwen/Qwen3-0.6B"

      # Larger default model:
      LOCAL_MODEL_NAME: "Qwen/Qwen3-4B-Instruct-2507"

      OPENVINO_DEVICE: "CPU"
      FORCE_HF_FALLBACK: "0"
      LOCAL_FILES_ONLY: "0"

      HF_CACHE_DIR: "/app/hf_cache"
      OV_MODELS_DIR: "/app/ov_models"
      OV_CACHE_DIR: "/app/ov_cache"

      MAX_INPUT_TOKENS: "2048"
      MAX_NEW_TOKENS: "320"
      TEMPERATURE: "0.7"
      TOP_P: "0.9"

      RAG_UPLOAD_DIR: "/app/rag_uploads"
      RAG_EMBED_MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
      RAG_EMBED_DEVICE: "cpu"
      RAG_MAX_CONTEXT_CHARS: "12000"

      MARKDOWN_OUTPUT_DIR: "/app/markdown_outputs"

      START_MLFLOW_UI: "1"
      OPEN_MLFLOW_UI_BROWSER: "0"
      MLFLOW_UI_HOST: "0.0.0.0"
      # Internal container port. Do not set this to 5002.
      MLFLOW_UI_PORT: "5001"
      MLFLOW_ROOT_DIR: "/app/mlflow_runs"
      MLFLOW_EXPERIMENT_NAME: "local-prompt-simulator-docker-cpu"

      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      GRADIO_INBROWSER: "0"

      TOKENIZERS_PARALLELISM: "false"

      PUBLIC_GRADIO_URL: "http://localhost:7860/"
      PUBLIC_MLFLOW_URL: "http://127.0.0.1:5002/"

      # HF_TOKEN: "hf_xxx"

    restart: unless-stopped
