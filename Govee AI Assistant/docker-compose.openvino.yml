name: govee-ai-assistant-openvino

services:
  app:
    image: govee-ai-assistant-openvino:latest
    build:
      context: .
      args:
        BASE_IMAGE: python:3.12-slim-bookworm
        RUNTIME_PROFILE: openvino
        INSTALL_QWEN_FAST: "0"
        INSTALL_CAUSAL_CONV1D: "0"
    env_file:
      - .env
    environment:
      GOVEE_MODEL_ID: ${GOVEE_FALLBACK_MODEL_ID:-unsloth/Qwen3-1.7B}
      GOVEE_FALLBACK_MODEL_ID: ${GOVEE_FALLBACK_MODEL_ID:-unsloth/Qwen3-1.7B}
      GOVEE_STT_DEVICE: ${GOVEE_STT_DEVICE:-cpu}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      HF_HOME: /cache/huggingface
    ports:
      - "7860:7860"
    volumes:
      - huggingface-cache:/cache/huggingface
      - openvino-cache:/app/ov_cache
    shm_size: "8gb"
    restart: unless-stopped

volumes:
  huggingface-cache:
  openvino-cache:
